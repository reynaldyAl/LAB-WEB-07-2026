<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papan Tugas Tim</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">
  <main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="text-2xl font-bold">Papan Tugas Tim</h1>
    <p class="mt-1 text-sm text-slate-500">Pilih anggota untuk melihat tugasnya.</p>

    <!-- daftar anggota -->
    <section class="mt-6">
      <h2 class="text-lg font-semibold">Anggota</h2>
      <p id="status-anggota" class="mt-2 text-sm text-slate-500"></p>
      <div id="daftar-anggota" class="mt-2 flex flex-wrap gap-2"></div>
    </section>

    <!-- tugas anggota -->
    <section class="mt-8 rounded-xl border border-slate-200 bg-white p-5">
      <h2 id="judul-tugas" class="text-lg font-semibold">Tugas</h2>
      <p id="ringkasan" class="mt-1 text-sm font-medium text-indigo-700"></p>
      <p id="status-tugas" class="mt-2 text-sm text-slate-500">Pilih anggota di atas.</p>

      <label for="cari" class="mt-4 block text-sm font-medium">Cari tugas</label>
      <input id="cari" type="search" placeholder="Ketik judul tugas..."
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">

      <form id="form-tugas" class="mt-4" novalidate>
        <label for="input-judul" class="block text-sm font-medium">Tugas baru</label>
        <div class="mt-1 flex gap-2">
          <input id="input-judul" type="text" placeholder="Minimal 5 karakter"
            class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button id="tombol-simpan" type="submit"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60">Simpan</button>
        </div>
        <p id="pesan-form" class="mt-1 min-h-[1.25rem] text-sm text-red-600"></p>
      </form>

      <p id="notifikasi" class="hidden rounded-lg bg-green-100 px-3 py-2 text-sm text-green-800"></p>

      <ul id="daftar-tugas" class="mt-3 space-y-2"></ul>
      <p id="kosong" class="hidden mt-3 text-sm text-slate-500"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
